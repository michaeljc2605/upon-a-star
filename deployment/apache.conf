ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2

# Leave room for Node and PHP within a small free web-service instance.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 3
    MaxRequestWorkers 3
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # The trusted public proxy terminates TLS; keep this HTTP port private.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On
    RewriteRule (^|/)\. - [R=404,END]
    RewriteRule ^/?(?:server|client|database|deployment|docs|documentation|downloads|scripts|node_modules)(?:/|$) - [R=404,END,NC]
    RewriteRule ^/?(?:package(?:-lock)?\.json|composer(?:\.lock|\.json)|Dockerfile|render\.yaml)$ - [R=404,END,NC]
    RewriteRule ^/?php/(?:includes(?:/|$)|_start\.php$) - [R=404,END,NC]

    # Match the decoded path on the original request too, so percent-encoded
    # directory names cannot expose the independent guest-booking entry point.
    RewriteCond %{ENV:REDIRECT_STATUS} ^$
    RewriteRule ^/?(?:base|php)(?:/|$) - [R=404,END,NC]

    # The assessed base and source PHP paths are not public production routes.
    # THE_REQUEST keeps internal /assets -> base/assets and page rewrites working.
    RewriteCond %{THE_REQUEST} "\s/+base(?:[/\s?]|%2f)" [NC]
    RewriteRule ^ - [R=404,END]
    RewriteCond %{THE_REQUEST} "\s/+php(?:[/\s?]|%2f)" [NC]
    RewriteRule ^ - [R=404,END]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyPass /api/ http://127.0.0.1:4000/api/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
