# Exercise the shared-host .htaccess with real Apache/PHP and no Node proxy.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 20

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
